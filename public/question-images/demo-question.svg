<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">クイズ問題用デモ画像</title>
  <desc id="description">青と緑のグラデーション背景にDEMO IMAGEと表示された画像</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#596aff"/>
      <stop offset="1" stop-color="#54d0a0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="500" rx="32" fill="url(#background)"/>
  <rect width="1200" height="500" rx="32" fill="url(#glow)"/>
  <circle cx="115" cy="105" r="78" fill="#ffffff" opacity=".08"/>
  <circle cx="1080" cy="420" r="145" fill="#101322" opacity=".1"/>
  <text x="600" y="235" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="82" font-weight="800" letter-spacing="10">DEMO IMAGE</text>
  <text x="600" y="305" text-anchor="middle" fill="#ffffff" opacity=".82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="600">QUESTION IMAGE PLACEHOLDER</text>
</svg>
